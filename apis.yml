aid: affy-medtech
name: Affy MedTech
description: >-
  Affy MedTech is a UK- and Netherlands-based health technology company behind Lynx, a
  modular, cloud-hosted platform for hospitals and healthcare delivery organisations that
  consolidates authoritative treatment information, patient booking, electronic medical
  records, clinical documentation, billing and claims validation, reporting, remote
  diagnostics and ambulatory ECG into a single system. Its Patient Interaction Module
  gives patients access to their own records, prescriptions, diagnostic images and
  treatment plans with self-service booking, digital consent and online payment, while
  the Super Switch Module acts as a real-time integration bridge between hospital systems
  such as radiology, laboratory and billing. The platform is marketed alongside Total
  Doctor / Total Health and is deployed by international hospital groups as well as
  smaller clinics and specialist centres. Affy MedTech is a Silver Industry Partner of
  openEHR International and operates alongside Vertice Software Solutions, which
  publishes Lynx in other markets. AFFY MEDTECH UKI LTD (company number 17000777) was
  incorporated in England on 30 January 2026 and is controlled by Affy Medtech B.V. of
  Amsterdam. As of September 2026 affymedtech.com serves only a "Coming Soon" placeholder
  and the company publishes no public developer program, API reference or
  machine-readable contract.
